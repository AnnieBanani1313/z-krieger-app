<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Z-Warriors · 15 Kämpfer Edition</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://googleapis.com">
  <link href="https://googleapis.com/css2?family=Anton&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Level-Up / Verwandlungs-Modal -->
  <div id="levelup-overlay" class="levelup-overlay hidden">
    <div class="levelup-card">
      <div class="badge-gold" id="levelup-badge">NEUE STUFE</div>
      <h2 id="levelup-title">STUFE 2 ERREICHT</h2>
      <p id="levelup-desc">Deine Kampfkraft explodiert!</p>
      <button id="close-levelup" class="btn-gold">WEITER KÄMPFEN</button>
    </div>
  </div>

  <div class="app-shell">
    <!-- Top Header -->
    <header class="game-header">
      <div>
        <span class="sub-tag">SAIYANS NEVER DIE</span>
        <h1 class="hero-title">FIGHTERS</h1>
      </div>
      <div class="power-pill">
        <span class="pill-label">GESAMT-KI</span>
        <span id="power-level" class="pill-value">1.000</span>
      </div>
    </header>

    <!-- Haupt-Bühne: Riesige Hintergrundschrift + Freigestellter Kämpfer + Hotspots -->
    <section class="hero-stage">
      <div class="watermark-text" id="bg-watermark">KÄMPFER 01</div>

      <div class="stage-top-bar">
        <span class="stage-num" id="char-num">001</span>
        <h2 class="fighter-name" id="fighter-title">SON-BLITZ · STUFE 1</h2>
        <span class="level-tag" id="level-label">LVL 1</span>
      </div>

      <!-- Kämpfer-Bühne (mix-blend-mode entfernt schwarzen Hintergrund automatisch!) -->
      <div class="fighter-scanner" id="aura-wrapper">
        <img id="fighter-img" src="c1_s1.png" alt="Kämpfer" class="fighter-img" />
        <div id="placeholder-box" class="placeholder-box hidden">
          <span id="placeholder-code">c1_s1.png</span>
          <small>Bild noch nicht hochgeladen</small>
        </div>

        <!-- Anklickbare Körperteile -->
        <button class="body-hotspot active" data-part="arms" style="top: 38%; left: 16%;">
          <span>💪 ARME</span>
        </button>
        <button class="body-hotspot" data-part="core" style="top: 52%; left: 50%;">
          <span>⚡ KERN</span>
        </button>
        <button class="body-hotspot" data-part="legs" style="top: 76%; left: 30%;">
          <span>🦵 BEINE</span>
        </button>

        <div class="energy-pedestal"></div>
      </div>

      <!-- Stufen-Umschalter (1 bis 5 für den gewählten Charakter) -->
      <div class="stage-pills" id="stage-pills"></div>

      <!-- Körperteil-Level -->
      <div class="body-stats-grid">
        <div class="stat-box" data-part-box="arms">
          <span class="stat-name">ARME</span>
          <strong id="stat-arms">LVL 1</strong>
        </div>
        <div class="stat-box" data-part-box="core">
          <span class="stat-name">KI-KERN</span>
          <strong id="stat-core">LVL 1</strong>
        </div>
        <div class="stat-box" data-part-box="legs">
          <span class="stat-name">BEINE</span>
          <strong id="stat-legs">LVL 1</strong>
        </div>
      </div>

      <!-- XP Balken -->
      <div class="xp-wrapper">
        <div class="xp-bar-bg">
          <div id="ki-bar-fill" class="xp-bar-fill" style="width: 0%;"></div>
        </div>
        <span id="xp-text" class="xp-numbers">0 / 100 XP</span>
      </div>
    </section>

    <!-- Kämpfer-Auswahl (Alle 15 Charaktere horizontal scrollbar im Dribbble-Look) -->
    <section class="roster-section">
      <div class="section-top">
        <h3>WÄHLE DEINEN KRIEGER (15)</h3>
        <span class="hint-text">Wischen →</span>
      </div>
      <div class="roster-scroll" id="character-roster"></div>
    </section>

    <!-- Körperteil-Training (Einfach -> Fortgeschritten -> Meister) -->
    <section class="training-section">
      <div class="section-top">
        <h3 id="selected-part-title">TRAINING: ARME & BRUST</h3>
        <div class="difficulty-tabs">
          <button class="diff-tab active" data-diff="easy">EINFACH</button>
          <button class="diff-tab" data-diff="advanced">PROFI</button>
          <button class="diff-tab" data-diff="master">MEISTER</button>
        </div>
      </div>
      <div class="workout-list" id="workout-list"></div>
    </section>

    <footer class="bottom-bar">
      <button id="reset-btn" class="reset-btn">Fortschritt zurücksetzen</button>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
