<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Z-Krieger Training</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://googleapis.com">
  <link href="https://googleapis.com/css2?family=Bangers&family=Chakra+Petch:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="speed-lines"></div>

  <!-- Level-Up / Verwandlungs-Popup -->
  <div id="levelup-overlay" class="levelup-overlay hidden">
    <div class="levelup-burst">
      <span class="comic-badge" id="levelup-badge">LEVEL UP!</span>
      <h2 id="levelup-title">SUPER-KRIEGER!</h2>
      <p id="levelup-desc">Deine Aura explodiert vor Energie!</p>
      <button id="close-levelup" class="comic-btn yellow">WEITER KÄMPFEN!</button>
    </div>
  </div>

  <div class="app-container">
    <!-- Scouter Top-Bar -->
    <header class="scouter-hud">
      <div class="scouter-lens">
        <span class="scouter-label">KAMPFKRAFT (KI)</span>
        <div id="power-level" class="power-number">1.000</div>
      </div>
      <div class="rank-box">
        <span class="scouter-label">AKTUELLE FORM</span>
        <div id="rank-name" class="rank-title">BASIS-KRIEGER</div>
      </div>
    </header>

    <!-- Kämpfer-Arena & Stufen-Bild -->
    <main class="arena-card">
      <div class="stage-tag" id="stage-badge">STUFE 1 / 5</div>
      
      <div id="aura-wrapper" class="aura-wrapper aura-stage-1">
        <img id="fighter-img" src="img_stufe1.jpg" alt="Z-Krieger" class="fighter-sprite" />
      </div>

      <!-- XP / Ki-Balken -->
      <div class="ki-bar-container">
        <div class="ki-bar-header">
          <span id="level-label">LEVEL 1</span>
          <span id="xp-text">0 / 100 XP</span>
        </div>
        <div class="ki-bar-track">
          <div id="ki-bar-fill" class="ki-bar-fill" style="width: 0%;"></div>
        </div>
      </div>

      <!-- Freigeschaltete Stufen umschalten -->
      <div class="stage-switcher" id="stage-switcher">
        <button class="stage-btn active" data-stage="1">STUFE 1</button>
        <button class="stage-btn locked" data-stage="2">🔒 2</button>
        <button class="stage-btn locked" data-stage="3">🔒 3</button>
        <button class="stage-btn locked" data-stage="4">🔒 4</button>
        <button class="stage-btn locked" data-stage="5">🔒 5</button>
      </div>
    </main>

    <!-- Trainings-Missionen -->
    <section class="missions-section">
      <h2 class="section-heading">TRAINING WÄHLEN</h2>
      
      <div class="mission-grid">
        <button class="mission-panel" data-xp="25" data-power="450">
          <div class="panel-icon">🦵</div>
          <div class="panel-info">
            <h3>15x KNIEBEUGEN</h3>
            <p>Schwerkraft-Training</p>
          </div>
          <span class="xp-pill">+25 XP</span>
        </button>

        <button class="mission-panel" data-xp="35" data-power="700">
          <div class="panel-icon">💪</div>
          <div class="panel-info">
            <h3>10x LIEGESTÜTZE</h3>
            <p>Kamehameha-Kraft</p>
          </div>
          <span class="xp-pill">+35 XP</span>
        </button>

        <button class="mission-panel" data-xp="20" data-power="300">
          <div class="panel-icon">⚡</div>
          <div class="panel-info">
            <h3>30 SEK. HAMPELMÄNNER</h3>
            <p>Momentane Teleportation</p>
          </div>
          <span class="xp-pill">+20 XP</span>
        </button>

        <button class="mission-panel boss" data-xp="60" data-power="1500">
          <div class="panel-icon">🔥</div>
          <div class="panel-info">
            <h3>1 MIN. PLANK + SPRINT</h3>
            <p>BOSS-HERAUSFORDERUNG</p>
          </div>
          <span class="xp-pill">+60 XP</span>
        </button>
      </div>
    </section>

    <footer class="app-footer">
      <button id="reset-btn" class="reset-link">Fortschritt zurücksetzen</button>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
