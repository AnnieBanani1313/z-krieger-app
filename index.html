<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Z-Krieger Training</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://googleapis.com">
  <link href="https://googleapis.com/css2?family=Bangers&family=Chakra+Petch:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Comic Speed-Lines Hintergrund -->
  <div class="speed-lines"></div>

  <!-- Level-Up Overlay -->
  <div id="levelup-overlay" class="levelup-overlay hidden">
    <div class="levelup-burst">
      <span class="comic-badge">NEUE STUFE!</span>
      <h2 id="levelup-title">SUPER-KRIEGER!</h2>
      <p id="levelup-desc">Deine Aura explodiert vor Energie!</p>
      <button id="close-levelup" class="comic-btn yellow">WEITER KÄMPFEN!</button>
    </div>
  </div>

  <div class="app-container">
    <!-- Scouter Top-Bar -->
    <header class="scouter-hud">
      <div class="scouter-lens">
        <span class="scouter-label">KAMPFKRAFT (KI)</span>
        <div id="power-level" class="power-number">1.000</div>
      </div>
      <div class="rank-box">
        <span class="scouter-label">STUFE</span>
        <div id="rank-name" class="rank-title">BASIS-KRIEGER</div>
      </div>
    </header>

    <!-- Kämpfer-Arena & Avatar -->
    <main class="arena-card">
      <div class="stage-tag" id="stage-badge">FORM 1 / 4</div>
      
      <div id="aura-wrapper" class="aura-wrapper aura-stage-1">
        <!-- Hier wird das Bild des gewählten Kämpfers geladen -->
        <img id="fighter-img" src="img/krieger-duo.png" alt="Z-Krieger" class="fighter-sprite" />
        <div class="lightning-fx"></div>
      </div>

      <!-- XP / Ki-Balken -->
      <div class="ki-bar-container">
        <div class="ki-bar-header">
          <span>KI-ENERGIE</span>
          <span id="xp-text">0 / 100 XP</span>
        </div>
        <div class="ki-bar-track">
          <div id="ki-bar-fill" class="ki-bar-fill" style="width: 0%;"></div>
        </div>
      </div>

      <!-- Kämpfer wechseln -->
      <div class="fighter-selector">
        <button class="select-chip active" data-fighter="duo">⚡ BRÜDER-DUO</button>
        <button class="select-chip" data-fighter="leon">🔥 LEON (BLITZ)</button>
        <button class="select-chip" data-fighter="noah">🌪️ NOAH (STURM)</button>
      </div>
    </main>

    <!-- Trainings-Missionen (Comic Panels) -->
    <section class="missions-section">
      <h2 class="section-heading">TRAINING WÄHLEN</h2>
      
      <div class="mission-grid">
        <button class="mission-panel" data-xp="25" data-power="350" data-name="Kniebeugen-Salve">
          <div class="panel-icon">🦵</div>
          <div class="panel-info">
            <h3>15x KNIEBEUGEN</h3>
            <p>Schwerkraft-Training</p>
          </div>
          <span class="xp-pill">+25 XP</span>
        </button>

        <button class="mission-panel" data-xp="35" data-power="500" data-name="Liegestütz-Welle">
          <div class="panel-icon">💪</div>
          <div class="panel-info">
            <h3>10x LIEGESTÜTZE</h3>
            <p>Kamehameha-Kraft</p>
          </div>
          <span class="xp-pill">+35 XP</span>
        </button>

        <button class="mission-panel" data-xp="20" data-power="250" data-name="Hampelmann-Sprint">
          <div class="panel-icon">⚡</div>
          <div class="panel-info">
            <h3>30 SEK. HAMPELMÄNNER</h3>
            <p>Telekinese-Speed</p>
          </div>
          <span class="xp-pill">+20 XP</span>
        </button>

        <button class="mission-panel boss" data-xp="60" data-power="1200" data-name="Super-Saiyajin-Prüfung">
          <div class="panel-icon">🔥</div>
          <div class="panel-info">
            <h3>1 MIN. PLANK + SPRINT</h3>
            <p>BOSS-HERAUSFORDERUNG</p>
          </div>
          <span class="xp-pill">+60 XP</span>
        </button>
      </div>
    </section>

    <footer class="app-footer">
      <button id="reset-btn" class="reset-link">Fortschritt zurücksetzen</button>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
