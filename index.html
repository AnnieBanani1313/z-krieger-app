<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="c1_s1.png" />
  <title>Z-Krieger Training</title>
  <link rel="stylesheet" href="style.css?v=14" />
</head>
<body>
  <!-- SCREEN 1: INTRO -->
  <section id="intro-screen" class="poster-screen">
    <div class="poster-hero-top">
      <h1 class="tall-orange-title">SAIYANS<br>NEVER<br>DIE</h1>
      <div class="hero-trio">
        <img class="trio-img trio-left" src="c2_s1.png" onerror="this.onerror=null;this.src='c2_s1.jpg'" alt="" />
        <img class="trio-img trio-right" src="c3_s1.png" onerror="this.onerror=null;this.src='c3_s1.jpg'" alt="" />
        <img id="intro-hero-img" class="trio-img trio-center" src="c1_s1.png" onerror="this.onerror=null;this.src='c1_s1.jpg'" alt="Krieger" />
      </div>
    </div>

    <div class="intro-bottom-block">
      <h2 class="poster-subheadline">WERDE ZUM SUPER-KRIEGER</h2>
      <p class="poster-copy">
        Trainiere deinen Körper, lade dein Ki auf und verwandle deine Krieger durch alle 5 Stufen.
      </p>
      <button id="enter-app-btn" class="tall-orange-btn">KRIEGER WÄHLEN &rarr;</button>
    </div>
  </section>

  <!-- SCREEN 2: KRIEGER AUSWÄHLEN -->
  <section id="select-screen" class="poster-screen select-layout hidden">
    <svg class="dragon-svg" viewBox="0 0 200 320" fill="currentColor" aria-hidden="true">
      <path d="M120,10 C155,20 175,60 155,95 C140,120 95,125 85,155 C75,185 130,200 135,235 C140,270 100,305 60,310 C95,290 110,260 100,235 C90,210 45,195 50,155 C55,115 105,105 115,80 C125,55 105,30 85,20 Z" />
      <circle cx="118" cy="42" r="7" fill="#0b0b0d" />
    </svg>

    <header class="poster-nav">
      <button id="back-to-intro" class="dark-square-btn" aria-label="Zurück">&lt;</button>
      <div class="user-profile-box">
        <div class="user-texts">
          <span class="hello-orange">HALLO, KRIEGER</span>
          <span class="ki-sub-line">KI: <strong id="select-power">0</strong></span>
        </div>
        <div class="avatar-thumb">
          <img id="header-avatar-img" alt="Avatar" />
        </div>
      </div>
